[package]
name = "fly-desktop"
version = "0.1.0"
description = "Non-interactive Fly desktop observation overlay"
edition = "2021"

[lib]
name = "fly_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tiny_http = "0.12"
